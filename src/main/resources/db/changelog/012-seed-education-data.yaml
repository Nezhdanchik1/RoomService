databaseChangeLog:
  - changeSet:
      id: 012-create-user-directions-table
      author: antigravity
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: user_directions
      changes:
        - createTable:
            tableName: user_directions
            columns:
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: direction_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: assigned_at
                  type: TIMESTAMP
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: user_directions
            columnNames: user_id, direction_id
            constraintName: pk_user_directions
        - addForeignKeyConstraint:
            constraintName: fk_user_directions_direction
            baseTableName: user_directions
            baseColumnNames: direction_id
            referencedTableName: directions
            referencedColumnNames: id
            onDelete: CASCADE

  - changeSet:
      id: 012-seed-education-data-once
      author: antigravity
      validCheckSum:
        - "9:5597678b37ca12d6db348420e723d4b8"
        - "9:89b4b361468144567aeb600b8d3ac7af"
      preConditions:
