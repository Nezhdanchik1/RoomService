              - column: { name: name, value: "Интеграция Spring Security" }
              - column: { name: description, value: "Настройка аутентификации, авторизации и защиты REST эндпоинтов с использованием JWT." }
              - column: { name: requires_expert_validation, valueBoolean: true }
        # Маршрутизация в React (комната 102 - Frontend Lab)
        - insert:
            tableName: skills
            columns:
              - column: { name: id, valueNumeric: 202 }
              - column: { name: room_id, valueNumeric: 102 }
              - column: { name: name, value: "Маршрутизация в React" }
              - column: { name: description, value: "Настройка клиентской маршрутизации с использованием React Router, включая вложенные и приватные роуты." }
              - column: { name: requires_expert_validation, valueBoolean: false }
        # Развертывание Docker (комната 103 - DevOps Lab)
        - insert:
            tableName: skills
