              - column: { name: description, value: "Разработайте SPA интернет-магазина. Используйте Zustand для управления глобальным состоянием корзины: добавление/удаление товаров, изменение количества, подсчет общей стоимости и сохранение состояния в LocalStorage с помощью middleware persist." }
