              - column: { name: requires_expert_validation, valueBoolean: true }
        # Управление состоянием React (комната 102 - Frontend Lab)
        - insert:
            tableName: skills
            columns:
              - column: { name: id, valueNumeric: 204 }
              - column: { name: room_id, valueNumeric: 102 }
