        # 1. Привязка экспертов (пользователь 3 - эксперт для Frontend=1 и Backend=2)
        - sql:
            sql: "INSERT INTO user_directions (user_id, direction_id) VALUES (3, 1) ON CONFLICT (user_id, direction_id) DO NOTHING;"
        - sql:
            sql: "INSERT INTO user_directions (user_id, direction_id) VALUES (3, 2) ON CONFLICT (user_id, direction_id) DO NOTHING;"

        # 2. Наполнение навыков (Skills)
        # Интеграция Spring Security (комната 101 - Backend Lab)
