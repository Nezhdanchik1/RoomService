              - column: { name: description, value: "Опишите сущности User, Post, Comment и Tag. Настройте связи ManyToOne (связь комментарий-пост), ManyToMany (посты и теги) с использованием JPA аннотаций. Настройте ленивую загрузку (FetchType.LAZY) для предотвращения N+1 проблем." }
        # Задание 6 для навыка 206
        - insert:
            tableName: assignments
